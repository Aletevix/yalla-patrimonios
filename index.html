<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalla — Controle de Equipamentos</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --amarelo:#FFCB05; --amarelo-d:#E0B000; --tinta:#12263A; --tinta-2:#1B3A57;
  --grafite:#0E1621; --papel:#F5F6F8; --branco:#FFFFFF;
  --linha:#E4E8EE; --texto:#1A2433; --muted:#7A8699;
  --verde:#12A150; --verde-bg:#E4F6EC; --azul:#2E6BE6; --azul-bg:#E5EDFC;
  --laranja:#E8590C; --laranja-bg:#FDECE0; --vermelho:#D42E2E; --vermelho-bg:#FBE6E6;
  --r:14px; --sombra:0 1px 2px rgba(16,30,54,.04), 0 4px 16px rgba(16,30,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--papel);color:var(--texto);font-size:14px;-webkit-font-smoothing:antialiased}
::selection{background:var(--amarelo);color:var(--tinta)}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--grafite);color:#C7D0DC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px}
.brand img{height:30px}
.brand .txt{font-weight:800;font-size:19px;color:#fff;letter-spacing:-.4px}
.brand .txt b{color:var(--amarelo)}
.side .tagline{font-size:11px;color:#6B7688;padding:0 20px 18px;letter-spacing:.3px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.menu a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#AEB9C7;cursor:pointer;font-weight:600;font-size:14px;transition:.15s}
.menu a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.menu a:hover{background:#182534;color:#fff}
.menu a.active{background:var(--amarelo);color:var(--tinta)}
.menu a.active svg{stroke:var(--tinta)}
.side .foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#5C6878;border-top:1px solid #1B2836}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--branco);border-bottom:1px solid var(--linha);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.topbar .crumb{color:var(--muted);font-size:13px}
.content{padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi .ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.kpi .ico svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:5px}
.grid{display:grid;gap:18px;margin-bottom:18px}
.grid.c2{grid-template-columns:1.1fr .9fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.card-h .hint{color:var(--muted);font-size:12px}
.card-b{padding:20px}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .center .big{font-size:32px;font-weight:800;letter-spacing:-1px}
.donut .center .sm{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.legend{display:flex;flex-direction:column;gap:12px;flex:1;min-width:160px}
.legend .li{display:flex;align-items:center;gap:10px;font-size:13px}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .li .val{margin-left:auto;font-weight:800}
.legend .li .pct{color:var(--muted);font-size:12px;width:42px;text-align:right}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:120px 1fr 34px;align-items:center;gap:12px;font-size:13px}
.bar-row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:9px;background:var(--papel);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--tinta-2),var(--tinta));transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-row .qtd{font-weight:800;text-align:right}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.tipo-card{border:1px solid var(--linha);border-radius:11px;padding:14px;text-align:center}
.tipo-card .ti{width:34px;height:34px;margin:0 auto 8px;border-radius:9px;background:var(--papel);display:flex;align-items:center;justify-content:center}
.tipo-card .ti svg{width:18px;height:18px;stroke:var(--tinta);fill:none;stroke-width:2}
.tipo-card .q{font-size:22px;font-weight:800}
.tipo-card .t{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-left:auto}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--branco);outline:none;color:var(--texto)}
input:focus,select:focus,textarea:focus{border-color:var(--amarelo-d);box-shadow:0 0 0 3px rgba(255,203,5,.22)}
.search{position:relative}
.search input{padding-left:34px;min-width:230px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.btn{background:var(--amarelo);color:var(--tinta);border:none;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.btn:hover{background:var(--amarelo-d)}
.btn.dark{background:var(--tinta);color:#fff}.btn.dark:hover{background:var(--grafite)}
.btn.ghost{background:var(--branco);border:1px solid var(--linha);color:var(--texto)}.btn.ghost:hover{background:var(--papel)}
.btn.danger{background:var(--vermelho);color:#fff}.btn.danger:hover{filter:brightness(.92)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--branco);text-align:left;padding:12px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--linha);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0}
th:hover{color:var(--texto)}
td{padding:12px 18px;border-bottom:1px solid var(--papel);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:#FFFCF0}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--tinta);color:var(--amarelo);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.name-cell{display:flex;align-items:center;gap:10px}
.name-cell .nm{font-weight:700}
.name-cell .sub{font-size:11.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag .d{width:6px;height:6px;border-radius:50%}
.tag.uso{background:var(--verde-bg);color:#0B7A3B}.tag.uso .d{background:var(--verde)}
.tag.disp{background:var(--azul-bg);color:#1B4FB8}.tag.disp .d{background:var(--azul)}
.tag.manut{background:var(--laranja-bg);color:#B8460A}.tag.manut .d{background:var(--laranja)}
.tag.baixa{background:var(--vermelho-bg);color:#A81F1F}.tag.baixa .d{background:var(--vermelho)}
.tag.tipo{background:var(--tinta);color:var(--amarelo)}
.tag.dep{background:var(--papel);color:#41506A;border:1px solid var(--linha)}
.tag.on{background:var(--verde-bg);color:#0B7A3B}
.tag.off{background:var(--vermelho-bg);color:#A81F1F}
.tag.pat{background:#EEF1F5;color:#41506A;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;flex-wrap:nowrap}
.muted{color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;stroke:var(--linha);fill:none;stroke-width:1.5;margin-bottom:12px}
.hist{max-height:340px;overflow-y:auto}
.hist .row{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--papel);font-size:13px;align-items:flex-start}
.hist .row .ic{width:28px;height:28px;border-radius:8px;background:var(--papel);flex:none;display:flex;align-items:center;justify-content:center}
.hist .row .ic svg{width:14px;height:14px;stroke:var(--tinta);fill:none;stroke-width:2}
.hist .row .when{color:var(--muted);font-size:11px;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(14,22,33,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(14,22,33,.4)}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-h h3{font-size:18px;font-weight:800}
.modal-b{padding:24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;width:32px;height:32px;border-radius:8px}
.close:hover{background:var(--papel);color:var(--texto)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#41506A}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{background:var(--papel);border:1px solid var(--linha);padding:8px 13px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.detail-grid .cell{background:var(--papel);padding:12px 14px;border-radius:10px}
.detail-grid .cell .k{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.detail-grid .cell .v{font-weight:700;margin-top:3px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--grafite);color:#fff;padding:14px 20px;border-radius:12px;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(16px);transition:.28s;border-left:4px solid var(--amarelo);font-weight:600;display:flex;align-items:center;gap:10px;max-width:420px}
.toast.show{opacity:1;transform:translateY(0)}
.toast svg{width:18px;height:18px;stroke:var(--amarelo);fill:none;stroke-width:2}
.mode-ed{background:var(--verde-bg);color:#0B7A3B;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
.mode-ro{background:#EEF1F5;color:#41506A;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
.saving{background:var(--amarelo);color:var(--tinta);padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:60;border-top:1px solid #1B2836}
  .brand,.tagline,.side .foot{display:none}
  .menu{flex-direction:row;width:100%;padding:6px;justify-content:space-around;gap:4px}
  .menu a{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 6px;flex:1;justify-content:center}
  .menu a svg{width:20px;height:20px}
  .main{padding-bottom:64px}
  .content{padding:18px 16px 40px}
  .topbar{padding:14px 16px}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  #topActions{width:100%;order:3}
}
@media(max-width:520px){.row2,.detail-grid{grid-template-columns:1fr}.search input{min-width:0;width:100%}.toolbar{width:100%}.search{flex:1}}
</style>
</head>

/* ===== Config GitHub ===== */
const GH_OWNER="Aletevix", GH_REPO="yalla-patrimonios", GH_BRANCH="main", GH_PATH="dados.json";
const RAW_URL=`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_PATH}`;
const API_URL=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
let fileSha=null;              // sha do dados.json (necessário pra atualizar)
let token=localStorage.getItem("yalla_gh_token")||"";
let dirty=false, saving=false;
function isEditor(){return !!token;}

async function load(){
  try{
    const r=await fetch(RAW_URL+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){DB=await r.json();}
    else throw new Error("raw "+r.status);
  }catch(e){
    // fallback: embutido (primeira carga antes do arquivo existir)
    DB={colaboradores:SEED.colaboradores,ativos:SEED.ativos,historico:[]};
  }
  if(!DB.historico)DB.historico=[];
  // pegar sha atual se for editor (pra poder salvar)
  if(isEditor())await refreshSha();
}
async function refreshSha(){
  try{
    const r=await fetch(API_URL+"?ref="+GH_BRANCH,{headers:ghHeaders(),cache:"no-store"});
    if(r.ok){const j=await r.json();fileSha=j.sha;}
  }catch(e){}
}
function ghHeaders(){return{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"};}

async function save(){
  if(!isEditor()){toast("Modo somente leitura — configure seu token para editar",true);return;}
  saving=true;updateBar();
  try{
    if(!fileSha)await refreshSha();
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,1))));
    const body={message:"Atualização de patrimônios — "+new Date().toLocaleString("pt-BR"),content,branch:GH_BRANCH};
    if(fileSha)body.sha=fileSha;
    const r=await fetch(API_URL,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
    if(r.status===409){await refreshSha();return save();} // conflito: recarrega sha e tenta 1x
    if(!r.ok){const t=await r.text();throw new Error(r.status+" "+t);}
    const j=await r.json();fileSha=j.content.sha;dirty=false;
  }catch(e){
    toast("Erro ao salvar no GitHub: "+e.message,true);
  }
  saving=false;updateBar();
}
function nextId(a){return a.length?Math.max(...a.map(x=>x.id))+1:1;}
function logHist(txt){DB.historico.unshift({id:Date.now()+Math.random(),txt,when:new Date().toISOString()});if(DB.historico.length>500)DB.historico.pop();}

function colabById(id){return DB.colaboradores.find(c=>c.id===id);}
function nomeColab(id){const c=colabById(id);return c?c.nome:"—";}
function iniciais(n){const p=n.trim().split(/\s+/);return ((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"");}
function statusTag(s){const m={"EM USO":"uso","DISPONÍVEL":"disp","MANUTENÇÃO":"manut","BAIXA":"baixa"};return `<span class="tag ${m[s]||'dep'}"><span class="d"></span>${s}</span>`;}
function fmtDate(iso){return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});}
function esc(s){return(s||"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,err){const t=document.getElementById("toast");t.innerHTML=(err?"":ICON.check)+`<span>${esc(msg)}</span>`;t.style.borderColor=err?"var(--vermelho)":"var(--amarelo)";t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

function kpi(ico,n,l,cor,bg){return `<div class="kpi"><div class="ico" style="background:${bg};color:${cor}">${ico}</div><div class="n">${n}</div><div class="l">${l}</div></div>`;}
function buildDonut(segs,total){
  if(!total)return '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#EEF1F5" stroke-width="4"/></svg>';
  let off=0;const R=15.9155,C=2*Math.PI*R;
  let circles='';
  segs.forEach(s=>{const frac=s.v/total;const len=frac*C;circles+=`<circle cx="18" cy="18" r="${R}" fill="none" stroke="${s.cor}" stroke-width="4" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 18 18)" stroke-linecap="butt"/>`;off+=len;});
  return `<svg viewBox="0 0 36 36" style="width:170px;height:170px"><circle cx="18" cy="18" r="${R}" fill="none" stroke="#EEF1F5" stroke-width="4"/>${circles}</svg>`;
}

function drawAtivos(){

  const ft=document.getElementById("fTipo").value,fs=document.getElementById("fStatus").value;
  let list=DB.ativos.filter(x=>{const nome=nomeColab(x.colaboradorId).toLowerCase();
    const hit=(x.patrimonio+" "+x.marca+" "+x.modelo+" "+nome+" "+x.tipo).toLowerCase().includes(q);
    return hit&&(!ft||x.tipo===ft)&&(!fs||x.status===fs);});
  const k=sortKey.ativos,dir=sortDir.ativos;
  list.sort((a,b)=>{let va=k==="colab"?nomeColab(a.colaboradorId):(a[k]||"");let vb=k==="colab"?nomeColab(b.colaboradorId):(b[k]||"");return String(va).localeCompare(String(vb),"pt",{numeric:true})*dir;});
  const th=(key,l)=>`<th onclick="setSort('ativos','${key}')">${l}${sortKey.ativos===key?(sortDir.ativos>0?" ↑":" ↓"):""}</th>`;
  document.getElementById("ativosTable").innerHTML=list.length?`<div class="tbl-wrap"><table><thead><tr>
    ${th("tipo","Tipo")}${th("patrimonio","Patrimônio")}${th("marca","Marca")}${th("modelo","Modelo")}${th("colab","Colaborador")}${th("status","Status")}<th>Ações</th>
    </tr></thead><tbody>
    ${list.map(x=>`<tr>

      <td>${x.colaboradorId?`<div class="name-cell"><span class="avatar">${esc(iniciais(nomeColab(x.colaboradorId)))}</span><span class="nm" style="font-weight:600">${esc(nomeColab(x.colaboradorId))}</span></div>`:'<span class="muted">— estoque —</span>'}</td>
      <td>${statusTag(x.status)}</td>
      <td class="actions">
        ${x.status==="EM USO"?`<button class="btn ghost sm" onclick="liberar(${x.id})">Liberar</button>`:`<button class="btn sm" onclick="modalDesignar(${x.id})">Designar</button>`}

function setSort(tab,key){const sk=tab==="ativos"?"ativos":"colab";if(sortKey[sk]===key)sortDir[sk]*=-1;else{sortKey[sk]=key;sortDir[sk]=1;}render();}

  logHist(`${a.tipo} ${a.patrimonio} designado: ${de} → ${nomeColab(cid)}`);

async function liberar(ativoId){
  const a=DB.ativos.find(x=>x.id===ativoId);const de=a.colaboradorId?nomeColab(a.colaboradorId):"—";

async function saveAtivo(aid){

  const tipo=document.getElementById("aTipo").value,marca=document.getElementById("aMarca").value.trim(),modelo=document.getElementById("aModelo").value.trim();

async function saveToken(){

function clearToken(){token="";localStorage.removeItem("yalla_gh_token");fileSha=null;closeModal();updateBar();toast("Token removido — modo somente leitura");render();}

/* ===== Relatório PDF ===== */
function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const W=doc.internal.pageSize.getWidth();
  const now=new Date().toLocaleString("pt-BR");
  // Cabeçalho
  doc.setFillColor(14,22,33);doc.rect(0,0,W,64,"F");
  doc.setFillColor(255,203,5);doc.rect(0,64,W,4,"F");
  doc.setTextColor(255,203,5);doc.setFont("helvetica","bold");doc.setFontSize(20);
  doc.text("YALLA",40,40);
  doc.setTextColor(255,255,255);doc.setFontSize(13);
  doc.text("Relatório de Patrimônios",120,40);
  doc.setTextColor(180,190,200);doc.setFontSize(9);
  doc.text("Emitido em "+now,W-40,40,{align:"right"});

  const a=DB.ativos;
  const cnt=s=>a.filter(x=>x.status===s).length;
  // Resumo
  doc.setTextColor(20,36,51);doc.setFontSize(10);doc.setFont("helvetica","bold");
  let y=90;
  const resumo=[["Total",a.length],["Em uso",cnt("EM USO")],["Disponíveis",cnt("DISPONÍVEL")],["Manutenção",cnt("MANUTENÇÃO")],["Baixa",cnt("BAIXA")],["Colaboradores",DB.colaboradores.filter(c=>c.ativo).length]];
  let x=40;
  resumo.forEach(([l,v])=>{
    doc.setFillColor(245,246,248);doc.roundedRect(x,y,120,44,4,4,"F");
    doc.setTextColor(122,134,153);doc.setFontSize(8);doc.setFont("helvetica","normal");
    doc.text(String(l).toUpperCase(),x+10,y+16);
    doc.setTextColor(18,38,58);doc.setFontSize(18);doc.setFont("helvetica","bold");
    doc.text(String(v),x+10,y+36);
    x+=132;
  });
  y+=64;

  // Tabela de ativos
  const rows=a.slice().sort((p,q)=>(p.tipo+p.patrimonio).localeCompare(q.tipo+q.patrimonio,"pt",{numeric:true}))
    .map(x=>[x.tipo,x.patrimonio,x.marca||"—",x.modelo||"—",x.colaboradorId?nomeColab(x.colaboradorId):"— estoque —",x.status]);
  doc.autoTable({
    startY:y,
    head:[["Tipo","Patrimônio","Marca","Modelo","Responsável","Status"]],
    body:rows,
    styles:{font:"helvetica",fontSize:8,cellPadding:4,overflow:"linebreak"},
    headStyles:{fillColor:[18,38,58],textColor:[255,203,5],fontStyle:"bold"},
    alternateRowStyles:{fillColor:[248,249,251]},
    columnStyles:{0:{cellWidth:80},1:{cellWidth:70},4:{cellWidth:180}},
    margin:{left:40,right:40},
    didParseCell:function(d){
      if(d.section==='body'&&d.column.index===5){
        const s=d.cell.raw;
        const cor={"EM USO":[18,161,80],"DISPONÍVEL":[46,107,230],"MANUTENÇÃO":[232,89,12],"BAIXA":[212,46,46]}[s];
        if(cor){d.cell.styles.textColor=cor;d.cell.styles.fontStyle='bold';}
      }
    },
    didDrawPage:function(d){
      const p=doc.internal.getNumberOfPages();
      doc.setFontSize(8);doc.setTextColor(150,160,170);
      doc.text("Yalla Car · Controle de Equipamentos",40,doc.internal.pageSize.getHeight()-20);
      doc.text("Página "+doc.internal.getCurrentPageInfo().pageNumber,W-40,doc.internal.pageSize.getHeight()-20,{align:"right"});
    }
  });
  doc.save("patrimonios-yalla-"+new Date().toISOString().slice(0,10)+".pdf");
  toast("Relatório PDF gerado");
}

(async()=>{await load();updateBar();render();})();
</script>
</body>
</html>
